services:
  postgres:
    image: postgres:16-alpine
    container_name: buddhi-postgres
    environment:
      POSTGRES_USER: buddhi
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: buddhi-ai
    ports:
      - "5432:5432"
    volumes:
      - buddhi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddhi -d buddhi-ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: buddhi-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-changeme-generate-a-random-string}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  buddhi_pg_data:
